spring:
  application:
    name: bridge

  datasource:
    url: ${BRIDGE_DB_URL:jdbc:postgresql://localhost:5432/bridge}
    username: ${BRIDGE_DB_USER:bridge}
    password: ${BRIDGE_DB_PASSWORD:bridge}

  jpa:
    # Flyway owns the schema. Hibernate only checks that entities agree with it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: ${BRIDGE_PORT:8080}

bridge:
  storage:
    # Relative paths to the CV files are stored in the database, never the bytes.
    cv-dir: ${BRIDGE_CV_DIR:./storage/cv}
    max-file-size-bytes: 5242880

logging:
  level:
    io.github.ielammari.bridge: INFO
