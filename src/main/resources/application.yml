spring:
  application:
    name: bridge

  # Optional overrides from .env in the working directory, the file docker
  # compose reads. Environment variables win.
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${BRIDGE_DB_URL:jdbc:postgresql://localhost:${BRIDGE_DB_PORT:5432}/${BRIDGE_DB_NAME:bridge}}
    username: ${BRIDGE_DB_USER:bridge}
    password: ${BRIDGE_DB_PASSWORD:bridge}

  jpa:
    # Flyway owns the schema. Hibernate only checks that entities agree with it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${BRIDGE_PORT:8080}

bridge:
  jwt:
    # HS256 requires at least 256 bits of key material. Override in every
    # environment that is not local development.
    secret: ${BRIDGE_JWT_SECRET:dev-secret-change-me-0123456789abcdefghijklmnop}
    expiry: PT24H
  oauth:
    google:
      # The public client id from the Google console. Left empty, the auth pages
      # offer no Google button and the endpoint refuses.
      client-id: ${BRIDGE_GOOGLE_CLIENT_ID:}
  storage:
    # Relative paths to the CV files are stored in the database, never the bytes.
    cv-dir: ${BRIDGE_CV_DIR:./storage/cv}
    max-file-size-bytes: 5242880
  demo:
    # DemoData: the placeholder CVs and the reset. Off under the prod profile.
    enabled: true
    # While true, every start empties the database and reloads the demonstration data.
    reset: ${BRIDGE_DEMO_RESET:false}
  admin:
    # The first recruiter, created when none exists, owing a password change.
    email: ${BRIDGE_ADMIN_EMAIL:}
    password: ${BRIDGE_ADMIN_PASSWORD:}
    first-name: ${BRIDGE_ADMIN_FIRST_NAME:Admin}
    last-name: ${BRIDGE_ADMIN_LAST_NAME:Bridge}

logging:
  level:
    io.github.ielammari.bridge: INFO
