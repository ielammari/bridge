spring:
  application:
    name: bridge

  datasource:
    url: ${BRIDGE_DB_URL:jdbc:postgresql://localhost:5432/bridge}
    username: ${BRIDGE_DB_USER:bridge}
    password: ${BRIDGE_DB_PASSWORD:bridge}

  jpa:
    # Flyway owns the schema. Hibernate only checks that entities agree with it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${BRIDGE_PORT:8080}

bridge:
  jwt:
    # HS256 requires at least 256 bits of key material. Override in every
    # environment that is not local development.
    secret: ${BRIDGE_JWT_SECRET:dev-secret-change-me-0123456789abcdefghijklmnop}
    expiry: PT24H
  storage:
    # Relative paths to the CV files are stored in the database, never the bytes.
    cv-dir: ${BRIDGE_CV_DIR:./storage/cv}
    max-file-size-bytes: 5242880

logging:
  level:
    io.github.ielammari.bridge: INFO
