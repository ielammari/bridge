# The clean production version and its database, as containers.
# docker compose -f docker-compose.prod.yml up -d --build
name: bridge-prod

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${BRIDGE_DB_NAME:-bridge}
      POSTGRES_USER: ${BRIDGE_DB_USER:-bridge}
      POSTGRES_PASSWORD: ${BRIDGE_DB_PASSWORD:?set BRIDGE_DB_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BRIDGE_DB_USER:-bridge} -d ${BRIDGE_DB_NAME:-bridge}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: bridge:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      BRIDGE_DB_URL: jdbc:postgresql://db:5432/${BRIDGE_DB_NAME:-bridge}
      BRIDGE_DB_USER: ${BRIDGE_DB_USER:-bridge}
      BRIDGE_DB_PASSWORD: ${BRIDGE_DB_PASSWORD}
      BRIDGE_JWT_SECRET: ${BRIDGE_JWT_SECRET:?set BRIDGE_JWT_SECRET}
      BRIDGE_ADMIN_EMAIL: ${BRIDGE_ADMIN_EMAIL:-}
      BRIDGE_ADMIN_PASSWORD: ${BRIDGE_ADMIN_PASSWORD:-}
      BRIDGE_ADMIN_FIRST_NAME: ${BRIDGE_ADMIN_FIRST_NAME:-Admin}
      BRIDGE_ADMIN_LAST_NAME: ${BRIDGE_ADMIN_LAST_NAME:-Bridge}
      BRIDGE_GOOGLE_CLIENT_ID: ${BRIDGE_GOOGLE_CLIENT_ID:-}
    ports:
      - "127.0.0.1:${BRIDGE_PORT:-8080}:8080"
    volumes:
      - cv:/app/storage/prod/cv

volumes:
  database:
  cv:
