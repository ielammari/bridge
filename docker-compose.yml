# Project local PostgreSQL. Data lives in ./.postgres-data, so the database
# version is pinned to the repository rather than to the host machine.
services:
  db:
    image: postgres:16
    container_name: bridge-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${BRIDGE_DB_NAME:-bridge}
      POSTGRES_USER: ${BRIDGE_DB_USER:-bridge}
      POSTGRES_PASSWORD: ${BRIDGE_DB_PASSWORD:-bridge}
    ports:
      - "${BRIDGE_DB_PORT:-5432}:5432"
    volumes:
      - ./.postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BRIDGE_DB_USER:-bridge} -d ${BRIDGE_DB_NAME:-bridge}"]
      interval: 5s
      timeout: 5s
      retries: 10
